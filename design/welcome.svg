<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="glow" cx="0.62" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#7C5CFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B85FF"/>
      <stop offset="1" stop-color="#6A47F5"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#84E3AF"/>
      <stop offset="1" stop-color="#28A870"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9BC8"/>
      <stop offset="1" stop-color="#D64A8B"/>
    </linearGradient>
    <linearGradient id="avatarA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#5233CC"/>
    </linearGradient>
    <linearGradient id="avatarB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2554A"/>
      <stop offset="1" stop-color="#B32E2E"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#08080B"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- ======== Левая половина: заголовок ======== -->
  <g transform="translate(96, 214)">
    <!-- Знак приложения -->
    <rect x="0" y="0" width="72" height="72" rx="22" fill="url(#logoFill)"/>
    <g fill="#FFFFFF">
      <rect x="19" y="19" width="14" height="14" rx="4.5"/>
      <rect x="39" y="19" width="14" height="14" rx="4.5"/>
      <rect x="19" y="39" width="14" height="14" rx="4.5"/>
      <rect x="39" y="39" width="14" height="14" rx="4.5"/>
    </g>
    <text x="90" y="49" font-family="Segoe UI, Inter, sans-serif" font-size="34" font-weight="700"
          fill="#FFFFFF" letter-spacing="-0.8">Habora</text>

    <text x="0" y="176" font-family="Segoe UI, Inter, sans-serif" font-size="70" font-weight="700"
          fill="#FFFFFF" letter-spacing="-2.6">Привычки</text>
    <text x="0" y="252" font-family="Segoe UI, Inter, sans-serif" font-size="70" font-weight="700"
          fill="#9B85FF" letter-spacing="-2.6">вдвоём</text>

    <text x="0" y="316" font-family="Segoe UI, Inter, sans-serif" font-size="25" font-weight="400"
          fill="#8E8E99">Зовите друга по ссылке — и видите</text>
    <text x="0" y="352" font-family="Segoe UI, Inter, sans-serif" font-size="25" font-weight="400"
          fill="#8E8E99">отметки друг друга каждый день</text>
  </g>

  <!-- ======== Правая половина: телефон ======== -->
  <g transform="translate(948, 360)">
    <!-- Мягкая тень под корпусом -->
    <rect x="-166" y="-306" width="332" height="612" rx="52" fill="#7C5CFF" opacity="0.30" filter="url(#soft)"/>

    <!-- Корпус -->
    <rect x="-160" y="-300" width="320" height="600" rx="46" fill="#0C0C10"/>
    <rect x="-160" y="-300" width="320" height="600" rx="46" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>

    <g transform="translate(-160, -300)">
      <!-- Верхняя панель -->
      <rect x="16" y="26" width="288" height="56" rx="28" fill="#16161C"/>
      <circle cx="50" cy="54" r="17" fill="#23232B"/>
      <g stroke="#C7C9D1" stroke-width="1.8" fill="none">
        <circle cx="50" cy="54" r="5.4"/>
        <path d="M50 45.4v-2.6M50 65.4v2.6M41.4 54h-2.6M61.4 54h2.6"/>
      </g>
      <circle cx="88" cy="54" r="17" fill="#23232B"/>
      <g fill="#C7C9D1">
        <rect x="79" y="48" width="18" height="5" rx="2.5"/>
        <rect x="79" y="56" width="18" height="5" rx="2.5"/>
      </g>
      <text x="152" y="63" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif"
            font-size="21" font-weight="700" fill="#FFFFFF">Друзья</text>
      <circle cx="270" cy="54" r="19" fill="#7C5CFF"/>
      <path d="M270 45v18M261 54h18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

      <!-- Карточка друга -->
      <rect x="16" y="98" width="288" height="196" rx="26" fill="#121218"/>

      <circle cx="52" cy="136" r="22" fill="url(#avatarA)"/>
      <text x="52" y="144" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif"
            font-size="20" font-weight="700" fill="#FFFFFF">А</text>
      <text x="84" y="132" font-family="Segoe UI, Inter, sans-serif" font-size="19"
            font-weight="700" fill="#FFFFFF">Аня</text>
      <text x="84" y="152" font-family="Segoe UI, Inter, sans-serif" font-size="14"
            fill="#6E6E78">@anya</text>

      <!-- Общая привычка: бег -->
      <rect x="30" y="170" width="260" height="52" rx="26" fill="#14251C"/>
      <g transform="translate(50, 196)" stroke="#4FC98D" stroke-width="2.6" stroke-linecap="round">
        <path d="M-8 0h16M-8-5v10M8-5v10"/>
      </g>
      <text x="70" y="192" font-family="Segoe UI, Inter, sans-serif" font-size="15"
            font-weight="700" fill="#FFFFFF">Бегать</text>
      <text x="70" y="209" font-family="Segoe UI, Inter, sans-serif" font-size="12"
            fill="#4FC98D">5 дн. подряд</text>
      <g fill="#4FC98D">
        <rect x="172" y="184" width="6" height="24" rx="3" opacity="0.95"/>
        <rect x="182" y="184" width="6" height="24" rx="3" opacity="0.95"/>
        <rect x="192" y="180" width="6" height="32" rx="3"/>
        <rect x="202" y="184" width="6" height="24" rx="3" opacity="0.95"/>
        <rect x="212" y="186" width="6" height="20" rx="3" opacity="0.32"/>
        <rect x="222" y="186" width="6" height="20" rx="3" opacity="0.32"/>
        <rect x="232" y="186" width="6" height="20" rx="3" opacity="0.32"/>
      </g>
      <circle cx="264" cy="196" r="18" fill="#D6F5E4"/>
      <path d="M256 196l6 6 11-12" stroke="#1E7A52" stroke-width="3.4" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Общая привычка: чтение -->
      <rect x="30" y="230" width="260" height="52" rx="26" fill="#2A1620"/>
      <g transform="translate(50, 256)" fill="#F072AC">
        <path d="M-7-7h11a3 3 0 013 3v11h-11a3 3 0 01-3-3z"/>
      </g>
      <text x="70" y="252" font-family="Segoe UI, Inter, sans-serif" font-size="15"
            font-weight="700" fill="#FFFFFF">Читать</text>
      <text x="70" y="269" font-family="Segoe UI, Inter, sans-serif" font-size="12"
            fill="#F072AC">2 дн. подряд</text>
      <g fill="#F072AC">
        <rect x="172" y="244" width="6" height="24" rx="3" opacity="0.32"/>
        <rect x="182" y="244" width="6" height="24" rx="3" opacity="0.95"/>
        <rect x="192" y="240" width="6" height="32" rx="3"/>
        <rect x="202" y="244" width="6" height="24" rx="3" opacity="0.95"/>
        <rect x="212" y="246" width="6" height="20" rx="3" opacity="0.32"/>
        <rect x="222" y="246" width="6" height="20" rx="3" opacity="0.32"/>
        <rect x="232" y="246" width="6" height="20" rx="3" opacity="0.32"/>
      </g>
      <circle cx="264" cy="256" r="18" fill="none" stroke="#F072AC" stroke-opacity="0.4" stroke-width="2"/>

      <!-- Кнопка приглашения -->
      <rect x="16" y="310" width="288" height="56" rx="28" fill="#191333"/>
      <rect x="16" y="310" width="288" height="56" rx="28" fill="none"
            stroke="#7C5CFF" stroke-opacity="0.45" stroke-width="1.5"/>
      <g transform="translate(112, 338)" fill="#9B85FF">
        <circle cx="-4" cy="-5" r="5"/>
        <path d="M-13 7c0-5 4-8 9-8s9 3 9 8z"/>
      </g>
      <text x="132" y="345" font-family="Segoe UI, Inter, sans-serif" font-size="17"
            font-weight="700" fill="#9B85FF">Пригласить друга</text>

      <!-- Нижние вкладки -->
      <rect x="46" y="512" width="228" height="56" rx="28" fill="#16161C"/>
      <rect x="52" y="518" width="108" height="44" rx="22" fill="#23203A"/>
      <g fill="#8E8E99">
        <rect x="94" y="530" width="9" height="9" rx="3"/>
        <rect x="107" y="530" width="9" height="9" rx="3"/>
        <rect x="94" y="543" width="9" height="9" rx="3"/>
        <rect x="107" y="543" width="9" height="9" rx="3"/>
      </g>
      <g transform="translate(217, 540)" fill="#7C5CFF">
        <circle cx="0" cy="-6" r="5.5"/>
        <path d="M-10 8c0-5.5 4.5-9 10-9s10 3.5 10 9z"/>
      </g>
    </g>
  </g>
</svg>
